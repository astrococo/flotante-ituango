name: Contorno de análisis (vegetación flotante por el río, óptico, radar y Landsat)

on:
  schedule:
    - cron: "41 17 * * *"   # todos los días, 12:41 hora de Colombia: solo fechas nuevas
  workflow_dispatch:
    inputs:
      zona:
        description: "Recalcular zona de agua y explorar catálogos (sí/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: contorno
  cancel-in-progress: false

env:
  GDAL_HTTP_MAX_RETRY: "5"
  GDAL_HTTP_RETRY_DELAY: "3"
  GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff,.TIF"

jobs:
  zona:
    if: ${{ github.event.inputs.zona == 'sí' || github.event.inputs.zona == 'si' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r satelite/requirements.txt
      - run: |
          mkdir -p satelite/datos/satelite/contorno
          cd satelite && python -u contorno.py explorar 2>&1 | tee datos/satelite/contorno/registro_zona.txt
      - name: Guardar
        run: |
          mkdir -p datos/satelite/contorno && cp -r satelite/datos/satelite/contorno/. datos/satelite/contorno/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos/satelite/contorno; git diff --cached --quiet && exit 0
          git commit -m "Contorno: zona de agua y catálogos $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
  sensor:
    needs: zona
    if: ${{ always() && needs.zona.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix: { s: [s2, s1, ls] }
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r satelite/requirements.txt
      - run: |
          mkdir -p satelite/datos/satelite/contorno
          cd satelite && (timeout 320m python -u contorno.py ${{ matrix.s }} 2>&1 | tee datos/satelite/contorno/registro_${{ matrix.s }}.txt || true)
      - name: Guardar
        if: always()
        run: |
          mkdir -p datos/satelite/contorno
          cp satelite/datos/satelite/contorno/escenas_${{ matrix.s }}.csv satelite/datos/satelite/contorno/registro_${{ matrix.s }}.txt datos/satelite/contorno/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/satelite/contorno/escenas_${{ matrix.s }}.csv datos/satelite/contorno/registro_${{ matrix.s }}.txt 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -m "Contorno: ${{ matrix.s }} $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*9)); done
  serie:
    needs: sensor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r satelite/requirements.txt
      - run: |
          mkdir -p satelite/datos/satelite/contorno && cp datos/satelite/contorno/* satelite/datos/satelite/contorno/
          cd satelite && python -u contorno.py serie 2>&1 | tee datos/satelite/contorno/registro_serie.txt
          cd .. && cp satelite/datos/satelite/contorno/serie.json satelite/datos/satelite/contorno/registro_serie.txt datos/satelite/contorno/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos/satelite/contorno; git diff --cached --quiet && exit 0
          git commit -m "Contorno: serie $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
