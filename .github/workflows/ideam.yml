name: Caudales IDEAM (afluentes)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 1 * *"

permissions:
  contents: write

jobs:
  ideam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q colombia-hydrodata
      - run: mkdir -p datos/ideam && (timeout 45m python scripts/ideam_caudal.py > datos/ideam/salida.txt 2>&1 || true); tail -c 3000 datos/ideam/salida.txt
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ideam; git diff --cached --quiet && exit 0
          git commit -m "Caudales IDEAM $(date -u '+%F')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
