name: Análisis satelital de la cola

on:
  schedule:
    - cron: "23 13 3 * *"   # día 3 de cada mes, 08:23 hora de Colombia
  workflow_dispatch:
    inputs:
      modo:
        description: "explorar | series"
        required: true
        default: "explorar"

permissions:
  contents: write

concurrency:
  group: satelite-${{ github.event.inputs.modo || 'series' }}
  cancel-in-progress: false

jobs:
  satelite:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r satelite/requirements.txt
      - name: Ejecutar
        env:
          GDAL_HTTP_MAX_RETRY: "5"
          GDAL_HTTP_RETRY_DELAY: "3"
          GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif"
        run: |
          set -o pipefail
          mkdir -p satelite/datos/satelite
          cd satelite
          python -u ${{ github.event.inputs.modo || 'series' }}.py 2>&1 | tee datos/satelite/registro_${{ github.event.inputs.modo || 'series' }}.txt
          cd ..
          [ -d satelite/datos ] && mkdir -p datos && cp -r satelite/datos/* datos/ || true
          if [ "${{ github.event.inputs.modo || 'series' }}" = "series" ]; then python satelite/publicar.py; fi
          true
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d satelite/datos ] && mkdir -p datos && cp -r satelite/datos/* datos/ || true
          git add datos/satelite
          git diff --cached --quiet && exit 0
          git commit -m "Satélite: ${{ github.event.inputs.modo || 'series' }} $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
