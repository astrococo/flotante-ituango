name: Datos de la app

on:
  push:
    paths: ["datos/DatosExtraccion.xlsx"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 openpyxl==3.1.5
      - name: Excel → datos/app/base.json
        run: python scripts/excel_a_json.py | tee datos/app/registro_datos.txt
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/app
          git diff --cached --quiet && exit 0
          git commit -m "Datos de la app desde DatosExtraccion.xlsx $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
