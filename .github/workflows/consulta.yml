name: Consulta de fuentes externas

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espacio"
        required: false
        default: ""
      post:
        description: "Peticiones POST JSON: url|cuerpo separadas por ;;"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir -p datos/consultas; i=0
          for u in $URLS; do i=$((i+1)); n=$(echo "$u" | sed 's#https\?://##; s#[^A-Za-z0-9._-]#_#g' | cut -c1-120)
            curl -sS -L --max-time 240 -o "datos/consultas/$n" -w "%{http_code} %{size_download} $u\n" "$u" >> datos/consultas/registro.txt 2>&1 || echo "error $u" >> datos/consultas/registro.txt; done
      - name: Peticiones POST
        if: ${{ github.event.inputs.post != '' }}
        env:
          POST: ${{ github.event.inputs.post }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, hashlib
          for i, item in enumerate([x for x in os.environ["POST"].split(";;") if x.strip()]):
              url, body = item.split("|", 1)
              n = re.sub(r"[^A-Za-z0-9._-]", "_", re.sub(r"https?://", "", url))[:80] + "_" + hashlib.md5(body.encode()).hexdigest()[:8]
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url.strip(), data=body.encode(), headers={"Content-Type": "application/json"}), timeout=240)
                  b = r.read(); code = r.status
              except Exception as e:
                  b = str(e).encode(); code = getattr(e, "code", "error")
              open(f"datos/consultas/{n}", "wb").write(b)
              open("datos/consultas/registro.txt", "a").write(f"POST {code} {len(b)} {url} {body}\n")
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/consultas; git diff --cached --quiet && exit 0
          git commit -m "Consulta de fuentes externas $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
